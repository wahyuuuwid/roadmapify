<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Path Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    /* [CSS SAMA PERSIS DARI INPUT USER - TIDAK DIUBAH] */
    :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --secondary: #10b981;
    --accent: #f59e0b;
    --bg: #0f172a;
    --bg-light: #1e293b;
    --bg-lighter: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
}

.app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.5rem;
    font-weight: 700;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.logo i {
    font-size: 2rem;
    -webkit-text-fill-color: #6366f1;
}

.nav {
    display: flex;
    gap: 30px;
}

.nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
}

.nav a:hover,
.nav a.active {
    color: var(--text);
}

.nav a.active::after {
    content: '';
    position: absolute;
    bottom: -24px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--primary);
}

/* Main Content */
.main {
    min-height: calc(100vh - 200px);
}

/* Hero */
.hero {
    text-align: center;
    margin-bottom: 50px;
}

.hero h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 16px;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero p {
    font-size: 1.25rem;
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
}

/* Form */
.generator-form {
    background: var(--bg-light);
    padding: 40px;
    border-radius: 24px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    max-width: 800px;
    margin: 0 auto;
}

.form-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 32px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-weight: 600;
    color: var(--text);
    font-size: 0.9rem;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 14px 18px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    transition: all 0.3s;
    font-family: inherit;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: var(--text-muted);
}

.checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    flex: 1;
    min-width: 140px;
}

.checkbox:hover {
    border-color: var(--primary-light);
}

.checkbox input {
    display: none;
}

.checkbox span {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
}

.checkbox input:checked + span {
    color: var(--primary-light);
}

.checkbox input:checked + span i {
    color: var(--primary);
}

.checkbox:has(input:checked) {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.1);
}

.generate-btn {
    width: 100%;
    padding: 18px;
    background: var(--gradient);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}

.generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
}

.generate-btn:active {
    transform: translateY(0);
}

.btn-loader {
    display: none;
}

.generate-btn.loading .btn-text {
    display: none;
}

.generate-btn.loading .btn-loader {
    display: inline;
}

/* Loading Section */
.loading-section {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
}

.loading-animation {
    text-align: center;
    max-width: 400px;
}

.brain {
    font-size: 5rem;
    color: var(--primary);
    margin-bottom: 30px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

.loading-text h3 {
    font-size: 1.5rem;
    margin-bottom: 10px;
}

.loading-text p {
    color: var(--text-muted);
}

.loading-bar {
    width: 100%;
    height: 4px;
    background: var(--bg-light);
    border-radius: 2px;
    margin-top: 30px;
    overflow: hidden;
}

.loading-progress {
    height: 100%;
    width: 0%;
    background: var(--gradient);
    border-radius: 2px;
    animation: loading 3s ease-in-out infinite;
}

@keyframes loading {
    0% { width: 0%; margin-left: 0%; }
    50% { width: 70%; margin-left: 30%; }
    100% { width: 0%; margin-left: 100%; }
}

/* Results Section */
.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 20px;
}

.back-btn {
    padding: 12px 24px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
}

.back-btn:hover {
    background: var(--bg-lighter);
    border-color: var(--primary);
}

.actions {
    display: flex;
    gap: 12px;
}

.action-btn {
    padding: 12px 20px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
}

.action-btn:hover {
    background: var(--primary);
    border-color: var(--primary);
    transform: translateY(-2px);
}

/* Learning Path Card */
.learning-path-card {
    background: var(--bg-light);
    border-radius: 24px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.path-header {
    background: var(--gradient);
    padding: 40px;
    color: white;
}

.path-header h2 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

.path-meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
}

.path-description {
    padding: 30px 40px;
    border-bottom: 1px solid var(--border);
}

.path-description h3 {
    margin-bottom: 15px;
    color: var(--primary-light);
}

.path-description p {
    color: var(--text-muted);
    line-height: 1.8;
}

.prerequisites {
    padding: 30px 40px;
    border-bottom: 1px solid var(--border);
}

.prerequisites h3 {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.prerequisites ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.prerequisites li {
    background: rgba(245, 158, 11, 0.1);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 0.9rem;
}

/* Milestones */
.milestones {
    padding: 40px;
}

.milestones h3 {
    font-size: 1.5rem;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.milestone {
    position: relative;
    padding-left: 40px;
    padding-bottom: 40px;
    border-left: 2px solid var(--border);
    margin-left: 20px;
}

.milestone:last-child {
    border-left: 2px solid transparent;
    padding-bottom: 0;
}

.milestone::before {
    content: attr(data-week);
    position: absolute;
    left: -20px;
    top: 0;
    width: 40px;
    height: 40px;
    background: var(--gradient);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
}

.milestone-content {
    background: var(--bg);
    padding: 25px;
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-left: 20px;
    transition: all 0.3s;
}

.milestone-content:hover {
    border-color: var(--primary);
    transform: translateX(5px);
}

.milestone-title {
    font-size: 1.25rem;
    margin-bottom: 10px;
    color: var(--text);
}

.milestone-desc {
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.6;
}

.topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.topic-tag {
    background: rgba(99, 102, 241, 0.1);
    color: var(--primary-light);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
}

.resources {
    margin-bottom: 20px;
}

.resources h4 {
    font-size: 0.9rem;
    margin-bottom: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.resource-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.resource-item {
    display: flex;
    align-items: start;
    gap: 12px;
    padding: 12px;
    background: var(--bg-light);
    border-radius: 8px;
    border: 1px solid var(--border);
}

.resource-icon {
    width: 32px;
    height: 32px;
    background: var(--bg-lighter);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-light);
    flex-shrink: 0;
}

.resource-info {
    flex: 1;
}

.resource-title {
    font-weight: 600;
    margin-bottom: 4px;
}

.resource-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
}

.resource-meta {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-muted);
}

.projects {
    background: rgba(16, 185, 129, 0.05);
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.projects h4 {
    color: var(--secondary);
    font-size: 0.9rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.projects ul {
    list-style: none;
}

.projects li {
    padding: 6px 0;
    padding-left: 20px;
    position: relative;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.projects li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--secondary);
}

.assessment {
    background: rgba(245, 158, 11, 0.05);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 10px;
    padding: 15px;
}

.assessment h4 {
    color: var(--accent);
    font-size: 0.9rem;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.assessment p {
    color: var(--text-muted);
    font-size: 0.9rem;
}

/* Outcome */
.outcome {
    background: var(--gradient);
    padding: 40px;
    color: white;
}

.outcome h3 {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.outcome p {
    line-height: 1.8;
    opacity: 0.9;
}

/* Footer */
.footer {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: 60px;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* Error Display */
.error-display {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    color: #fca5a5;
}

.error-display h3 {
    margin-bottom: 10px;
    color: #ef4444;
}

.error-display pre {
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.85rem;
    margin-top: 10px;
}

/* Utilities */
.hidden {
    display: none !important;
}

/* Responsive */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 2rem;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .generator-form {
        padding: 25px;
    }

    .path-header {
        padding: 30px 20px;
    }

    .path-header h2 {
        font-size: 1.75rem;
    }

    .milestones {
        padding: 20px;
    }

    .milestone {
        padding-left: 30px;
        margin-left: 15px;
    }

    .milestone::before {
        width: 30px;
        height: 30px;
        left: -15px;
        font-size: 0.7rem;
    }

    .milestone-content {
        margin-left: 10px;
        padding: 20px;
    }
}
</style>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>PathFinder AI</span>
            </div>
            <nav class="nav">
                <a href="#" class="active">Generator</a>
                <a href="#about">About</a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Input Section -->
            <section class="input-section" id="inputSection">
                <div class="hero">
                    <h1>Generate Your Personalized Learning Path</h1>
                    <p>Powered by Groq AI - Create structured, week-by-week learning plans tailored to your goals</p>
                </div>

                <form class="generator-form" id="generatorForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="topic">What do you want to learn?</label>
                            <input type="text" id="topic" name="topic" placeholder="e.g., Machine Learning, React.js, Digital Marketing" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="currentLevel">Current Level</label>
                                <select id="currentLevel" name="currentLevel" required>
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="targetLevel">Target Level</label>
                                <select id="targetLevel" name="targetLevel" required>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                    <option value="expert">Expert</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="durationWeeks">Duration (weeks)</label>
                                <input type="number" id="durationWeeks" name="durationWeeks" min="1" max="52" value="12" required>
                            </div>

                            <div class="form-group">
                                <label for="weeklyHours">Hours per week</label>
                                <input type="number" id="weeklyHours" name="weeklyHours" min="1" max="40" value="10" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Learning Preferences (select all that apply)</label>
                            <div class="checkbox-group">
                                <label class="checkbox">
                                    <input type="checkbox" name="preferences" value="video">
                                    <span><i class="fas fa-video"></i> Video Courses</span>
                                </label>
                                <label class="checkbox">
                                    <input type="checkbox" name="preferences" value="reading">
                                    <span><i class="fas fa-book"></i> Reading</span>
                                </label>
                                <label class="checkbox">
                                    <input type="checkbox" name="preferences" value="project-based">
                                    <span><i class="fas fa-code"></i> Project Based</span>
                                </label>
                                <label class="checkbox">
                                    <input type="checkbox" name="preferences" value="interactive">
                                    <span><i class="fas fa-laptop-code"></i> Interactive</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="goals">Specific Goals</label>
                            <textarea id="goals" name="goals" rows="3" placeholder="What do you want to achieve? e.g., Build a portfolio, Get certified, Career switch..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="generate-btn" id="generateBtn">
                        <span class="btn-text">Generate Learning Path</span>
                        <span class="btn-loader hidden">
                            <i class="fas fa-spinner fa-spin"></i> Generating...
                        </span>
                    </button>
                </form>
            </section>

            <!-- Loading Section -->
            <section class="loading-section hidden" id="loadingSection">
                <div class="loading-animation">
                    <div class="brain">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="loading-text">
                        <h3>Groq AI is designing your path...</h3>
                        <p id="loadingStatus">Analyzing your requirements</p>
                    </div>
                    <div class="loading-bar">
                        <div class="loading-progress"></div>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section hidden" id="resultsSection">
                <div class="results-header">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i> Create New Path
                    </button>
                    <div class="actions">
                        <button class="action-btn" id="downloadBtn">
                            <i class="fas fa-download"></i> Download JSON
                        </button>
                        <button class="action-btn" id="shareBtn">
                            <i class="fas fa-share"></i> Share
                        </button>
                    </div>
                </div>

                <div id="errorContainer"></div>
                <div class="learning-path-card" id="learningPathCard">
                    <!-- Content will be injected here -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by <strong>Groq AI</strong> & Built with Go</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api/v1';

        // DOM Elements
        const generatorForm = document.getElementById('generatorForm');
        const inputSection = document.getElementById('inputSection');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const learningPathCard = document.getElementById('learningPathCard');
        const generateBtn = document.getElementById('generateBtn');
        const backBtn = document.getElementById('backBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');
        const errorContainer = document.getElementById('errorContainer');

        let currentLearningPath = null;

        // Event Listeners
        generatorForm.addEventListener('submit', handleGenerate);
        backBtn.addEventListener('click', showInputSection);
        downloadBtn.addEventListener('click', downloadJSON);
        shareBtn.addEventListener('click', sharePath);

        async function handleGenerate(e) {
            e.preventDefault();
            errorContainer.innerHTML = ''; // Clear previous errors
            
            const formData = new FormData(generatorForm);
            const preferences = [];
            formData.getAll('preferences').forEach(p => preferences.push(p));
            
            const requestData = {
                topic: formData.get('topic'),
                current_level: formData.get('currentLevel'),
                target_level: formData.get('targetLevel'),
                duration_weeks: parseInt(formData.get('durationWeeks')),
                weekly_hours: parseInt(formData.get('weeklyHours')),
                preferences: preferences,
                goals: formData.get('goals')
            };

            showLoading();
            
            try {
                const response = await fetch(`${API_BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const res = await response.json();
                const data = res.data;

                if (!response.ok) {
                    throw new Error(data.error || `HTTP error! status: ${response.status}`);
                }

                if (!data.milestones || !Array.isArray(data.milestones)) {
                    console.error('Invalid response structure:', data);
                    throw new Error('Invalid response format from server');
                }

                currentLearningPath = data;
                displayLearningPath(currentLearningPath);
                showResults();
                showToast('Learning path generated successfully!', 'success');
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
                showInputSection();
            }
        }

        function displayLearningPath(path) {
            if (!path) {
                showError('No data received');
                return;
            }

            const safeGet = (obj, key, defaultVal = '') => obj && obj[key] !== undefined ? obj[key] : defaultVal;
            const safeArray = (arr) => Array.isArray(arr) ? arr : [];

            const html = `
                <div class="path-header">
                    <h2>${safeGet(path, 'topic', 'Learning Path')}</h2>
                    <div class="path-meta">
                        <div class="meta-item">
                            <i class="fas fa-signal"></i>
                            ${safeGet(path, 'current_level', 'beginner')} → ${safeGet(path, 'target_level', 'expert')}
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-calendar"></i>
                            ${safeGet(path, 'duration_weeks', 0)} weeks
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-clock"></i>
                            ${safeGet(path, 'total_hours', 0)} hours total
                        </div>
                    </div>
                </div>

                <div class="path-description">
                    <h3><i class="fas fa-info-circle"></i> Overview</h3>
                    <p>${safeGet(path, 'description', 'No description available')}</p>
                </div>

                <div class="prerequisites">
                    <h3><i class="fas fa-clipboard-check"></i> Prerequisites</h3>
                    <ul>
                        ${safeArray(path.prerequisites).map(p => `<li>${p}</li>`).join('') || '<li>None specified</li>'}
                    </ul>
                </div>

                <div class="milestones">
                    <h3><i class="fas fa-flag-checkered"></i> Learning Milestones</h3>
                    ${safeArray(path.milestones).map((milestone, index) => `
                        <div class="milestone" data-week="${safeGet(milestone, 'week', index + 1)}">
                            <div class="milestone-content">
                                <h4 class="milestone-title">${safeGet(milestone, 'title', `Week ${index + 1}`)}</h4>
                                <p class="milestone-desc">${safeGet(milestone, 'description', '')}</p>
                                
                                <div class="topics">
                                    ${safeArray(milestone.topics).map(topic => `<span class="topic-tag">${topic}</span>`).join('')}
                                </div>

                                <div class="resources">
                                    <h4>Resources</h4>
                                    <div class="resource-list">
                                        ${safeArray(milestone.resources).map(resource => `
                                            <div class="resource-item">
                                                <div class="resource-icon">
                                                    <i class="fas ${getResourceIcon(safeGet(resource, 'type', 'article'))}"></i>
                                                </div>
                                                <div class="resource-info">
                                                    <div class="resource-title">${safeGet(resource, 'title', 'Untitled')}</div>
                                                    <div class="resource-desc">${safeGet(resource, 'description', '')}</div>
                                                    ${resource && resource.duration ? `
                                                        <div class="resource-meta">
                                                            <span><i class="fas fa-clock"></i> ${resource.duration}</span>
                                                            ${resource.url ? `<span><i class="fas fa-external-link-alt"></i> <a href="${resource.url}" target="_blank">Open</a></span>` : ''}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        `).join('') || '<p style="color: var(--text-muted); font-size: 0.9rem;">No resources specified</p>'}
                                    </div>
                                </div>

                                ${safeArray(milestone.projects).length > 0 ? `
                                    <div class="projects">
                                        <h4><i class="fas fa-code"></i> Hands-on Projects</h4>
                                        <ul>
                                            ${milestone.projects.map(project => `<li>${project}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}

                                <div class="assessment">
                                    <h4><i class="fas fa-tasks"></i> Assessment</h4>
                                    <p>${safeGet(milestone, 'assessment', 'Complete all projects and review topics')}</p>
                                </div>
                            </div>
                        </div>
                    `).join('') || '<p style="padding: 20px; color: var(--text-muted);">No milestones available</p>'}
                </div>

                <div class="outcome">
                    <h3><i class="fas fa-trophy"></i> Expected Outcome</h3>
                    <p>${safeGet(path, 'outcome', 'Master the topic at target level')}</p>
                </div>
            `;
            
            learningPathCard.innerHTML = html;
        }

        function getResourceIcon(type) {
            const icons = {
                'video': 'fa-play-circle',
                'article': 'fa-file-alt',
                'book': 'fa-book',
                'course': 'fa-graduation-cap',
                'project': 'fa-code',
                'documentation': 'fa-file-code',
                'tutorial': 'fa-chalkboard-teacher'
            };
            return icons[type] || 'fa-link';
        }

        function showLoading() {
            inputSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            generateBtn.classList.add('loading');
            
            const statuses = [
                'Analyzing your requirements...',
                'Researching best resources...',
                'Structuring learning modules...',
                'Creating milestones...',
                'Finalizing your path...'
            ];
            
            let i = 0;
            const statusEl = document.getElementById('loadingStatus');
            const interval = setInterval(() => {
                if (loadingSection.classList.contains('hidden')) {
                    clearInterval(interval);
                    return;
                }
                statusEl.textContent = statuses[i % statuses.length];
                i++;
            }, 1500);
        }

        function showResults() {
            loadingSection.classList.add('hidden');
            inputSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            generateBtn.classList.remove('loading');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showInputSection() {
            resultsSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            generateBtn.classList.remove('loading');
            errorContainer.innerHTML = '';
            generatorForm.reset();
        }

        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-display">
                    <h3><i class="fas fa-exclamation-triangle"></i> Error</h3>
                    <p>${message}</p>
                </div>
            `;
            resultsSection.classList.remove('hidden');
            loadingSection.classList.add('hidden');
            inputSection.classList.add('hidden');
        }

        function downloadJSON() {
            if (!currentLearningPath) return;
            
            const dataStr = JSON.stringify(currentLearningPath, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `learning-path-${currentLearningPath.topic.toLowerCase().replace(/\s+/g, '-')}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast('Learning path downloaded!', 'success');
        }

        async function sharePath() {
            if (!currentLearningPath) return;
            
            const shareData = {
                title: `Learning Path: ${currentLearningPath.topic}`,
                text: `Check out my ${currentLearningPath.duration_weeks}-week learning plan for ${currentLearningPath.topic}!`,
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    showToast('Link copied to clipboard!', 'success');
                }
            } catch (err) {
                console.error('Error sharing:', err);
            }
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            });

            document.querySelectorAll('.milestone').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.6s ease-out';
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
